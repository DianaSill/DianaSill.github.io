<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="300" height="200" fill="#0d1117" rx="8"/>
  <rect x="0" y="0" width="300" height="30" fill="#21262d" rx="8 8 0 0"/>
  <circle cx="15" cy="15" r="4" fill="#ff5f56"/>
  <circle cx="30" cy="15" r="4" fill="#ffbd2e"/>
  <circle cx="45" cy="15" r="4" fill="#27ca3f"/>
  <text x="150" y="20" font-family="monospace" font-size="12" fill="#8b949e" text-anchor="middle">Modular API - Cross-Account</text>

  <g font-family="monospace" font-size="11" fill="#e6edf3">
    <text x="15" y="50" fill="#7c3aed">$</text>
    <text x="25" y="50">curl api.council.gov.uk/halo-itsm/</text>

    <text x="15" y="75" fill="#3b82f6">→</text>
    <text x="25" y="75" fill="#8b949e">API Gateway (Account A)</text>

    <text x="15" y="95" fill="#f59e0b">→</text>
    <text x="25" y="95" fill="#8b949e">AssumeRole (cross-account)</text>

    <text x="15" y="115" fill="#22c55e">→</text>
    <text x="25" y="115" fill="#8b949e">Lambda (Account B)</text>

    <text x="15" y="135" fill="#22c55e">→</text>
    <text x="25" y="135" fill="#8b949e">Resource policy validated</text>

    <text x="15" y="160" fill="#22c55e">✓</text>
    <text x="25" y="160">{"ticket_id": 12345}</text>

    <rect x="15" y="170" width="270" height="1" fill="#21262d"/>

    <text x="15" y="188" fill="#8b949e" font-size="10">1 domain · many accounts · 0 DNS changes</text>
  </g>
</svg>
